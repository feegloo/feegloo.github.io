name: Renew UDID profile certificate

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Renew even when the current certificate is still valid
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: renew-udid-profile-certificate
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      DOMAIN: aleksanderfigiel.pl
      PROJECT_REF: gwfdnwlhonszocjizrnl
      CERT_PATH: tools/udid-service/certificates/fullchain.pem
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
      ACME_DNS_USERNAME: ${{ secrets.ACME_DNS_USERNAME }}
      ACME_DNS_PASSWORD: ${{ secrets.ACME_DNS_PASSWORD }}
      ACME_DNS_SUBDOMAIN: ${{ secrets.ACME_DNS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$LETSENCRYPT_EMAIL" || { echo "Missing LETSENCRYPT_EMAIL"; exit 1; }
          test -n "$ACME_DNS_USERNAME" || { echo "Missing ACME_DNS_USERNAME"; exit 1; }
          test -n "$ACME_DNS_PASSWORD" || { echo "Missing ACME_DNS_PASSWORD"; exit 1; }
          test -n "$ACME_DNS_SUBDOMAIN" || { echo "Missing ACME_DNS_SUBDOMAIN"; exit 1; }

      - name: Check certificate expiry
        id: expiry
        shell: bash
        run: |
          if [[ "${{ inputs.force || 'false' }}" == "true" ]] || \
             [[ ! -f "$CERT_PATH" ]] || \
             ! openssl x509 -checkend 2592000 -noout -in "$CERT_PATH"; then
            echo "renew=true" >> "$GITHUB_OUTPUT"
          else
            echo "renew=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Certbot
        if: steps.expiry.outputs.renew == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y certbot

      - uses: supabase/setup-cli@v1
        if: steps.expiry.outputs.renew == 'true'
        with:
          version: latest

      - name: Configure Git
        if: steps.expiry.outputs.renew == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Issue certificate
        if: steps.expiry.outputs.renew == 'true'
        env:
          AUTH_HOOK: ${{ runner.temp }}/acme-dns-auth.sh
        run: |
          cat > "$AUTH_HOOK" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          payload="$(printf '{\"subdomain\":\"%s\",\"txt\":\"%s\"}' \
            "$ACME_DNS_SUBDOMAIN" "$CERTBOT_VALIDATION")"
          response="$(curl --silent --show-error --fail \
            --request POST \
            --header "X-Api-User: $ACME_DNS_USERNAME" \
            --header "X-Api-Key: $ACME_DNS_PASSWORD" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://auth.acme-dns.io/update)"

          if ! grep -Fq "$CERTBOT_VALIDATION" <<< "$response"; then
            echo "::error title=acme-dns update failed::The API did not confirm the DNS challenge value."
            exit 1
          fi

          record="$ACME_DNS_SUBDOMAIN.auth.acme-dns.io"
          echo "Waiting for TXT $record..."
          for attempt in $(seq 1 90); do
            if dig +short TXT "$record" @8.8.8.8 | tr -d '\"' | grep -Fxq "$CERTBOT_VALIDATION"; then
              echo "acme-dns challenge detected."
              exit 0
            fi
            sleep 5
          done

          echo "::error title=acme-dns propagation timed out::The expected TXT record was not visible within 7.5 minutes."
          exit 1
          SCRIPT
          chmod 700 "$AUTH_HOOK"
          certbot certonly \
            --manual \
            --preferred-challenges dns \
            --manual-auth-hook "$AUTH_HOOK" \
            --non-interactive \
            --agree-tos \
            --key-type rsa \
            --rsa-key-size 2048 \
            --email "$LETSENCRYPT_EMAIL" \
            --config-dir "$RUNNER_TEMP/letsencrypt/config" \
            --work-dir "$RUNNER_TEMP/letsencrypt/work" \
            --logs-dir "$RUNNER_TEMP/letsencrypt/logs" \
            --domain "$DOMAIN"

      - name: Update Supabase signing secrets
        if: steps.expiry.outputs.renew == 'true'
        shell: bash
        run: |
          live="$RUNNER_TEMP/letsencrypt/config/live/$DOMAIN"
          secrets_file="$RUNNER_TEMP/udid-signing.env"
          key_base64="$(base64 -w 0 "$live/privkey.pem")"
          chain_base64="$(base64 -w 0 "$live/fullchain.pem")"
          echo "::add-mask::$key_base64"
          echo "::add-mask::$chain_base64"
          chmod 700 "$RUNNER_TEMP"
          printf 'UDID_SIGNING_KEY_BASE64=%s\nUDID_SIGNING_CERT_BASE64=%s\n' \
            "$key_base64" "$chain_base64" > "$secrets_file"
          chmod 600 "$secrets_file"
          set +e
          supabase_output="$(supabase secrets set \
            --project-ref "$PROJECT_REF" \
            --env-file "$secrets_file" 2>&1)"
          supabase_status=$?
          set -e

          if [[ $supabase_status -ne 0 ]]; then
            if grep -Eqi '401|unauthorized|invalid([^[:alnum:]]+)(access[ _-]?)?token|token([^[:alnum:]]+)expired|expired([^[:alnum:]]+)token' <<< "$supabase_output"; then
              echo "::error title=Supabase access token expired or invalid::Create a new Supabase access token and replace the SUPABASE_ACCESS_TOKEN GitHub Actions secret."
            elif grep -Eqi '403|forbidden|insufficient([^[:alnum:]]+)permission|permission([^[:alnum:]]+)denied' <<< "$supabase_output"; then
              echo "::error title=Supabase token lacks permission::Grant the token write access to Edge Function secrets for project $PROJECT_REF."
            else
              echo "::error title=Failed to update Supabase secrets::The Supabase CLI command failed. See its output below."
            fi
            printf '%s\n' "$supabase_output"
            exit "$supabase_status"
          fi

          printf '%s\n' "$supabase_output"

      - name: Verify signed profile
        if: steps.expiry.outputs.renew == 'true'
        shell: bash
        run: |
          state="$(printf 'a%.0s' {1..64})"
          profile="$RUNNER_TEMP/udid.mobileconfig"
          payload="$RUNNER_TEMP/udid.plist"
          url="https://$PROJECT_REF.supabase.co/functions/v1/udid-service-301/profile?state=$state"

          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --output "$profile" --write-out '%{http_code}' "$url" || true)"
            if [[ "$status" == "200" ]]; then
              break
            fi
            sleep 5
          done

          test "$status" = "200" || { echo "Profile endpoint returned HTTP $status"; exit 1; }
          openssl smime -verify -inform DER -in "$profile" -noverify -out "$payload"
          openssl pkcs7 -inform DER -in "$profile" -print_certs -noout | grep -Fq "CN = $DOMAIN"
          grep -Fq "<key>PayloadType</key><string>Profile Service</string>" "$payload"
          echo "Signed profile verification passed."

      - name: Store public certificate chain
        if: steps.expiry.outputs.renew == 'true'
        run: |
          live="$RUNNER_TEMP/letsencrypt/config/live/$DOMAIN"
          mkdir -p "$(dirname "$CERT_PATH")"
          cp "$live/fullchain.pem" "$CERT_PATH"
          git add -f "$CERT_PATH"
          git commit -m "Renew UDID profile signing certificate [skip ci]"
          git push origin HEAD:main
