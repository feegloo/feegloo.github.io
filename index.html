<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aleksander Figiel - CV</title>
    <meta name="description" content="Aleksander Figiel, JavaScript Software Engineer" />

    <style>
      :root {
        --switcher-width: clamp(210px, 18vw, 290px);
        --background: #292929;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background);
      }

      .document-viewer {
        width: calc(100% - var(--switcher-width));
        height: 100%;
      }

      .document-viewer embed {
        display: block;
        width: 100%;
        height: 100%;
      }

      .document-switcher {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        display: flex;
        width: var(--switcher-width);
        height: 100%;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .document-switcher__button {
        display: inline-flex;
        min-width: 180px;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 18px 22px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 12px;
        background: rgba(20, 20, 20, 0.92);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
        color: #fff;
        font: 700 18px/1.2 Arial, sans-serif;
        cursor: pointer;
        pointer-events: auto;
        transition:
          transform 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .document-switcher__button:hover {
        background: #111;
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.5);
        transform: translateX(4px);
      }

      .document-switcher__button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .document-switcher__arrow {
        display: inline-block;
        font-size: 30px;
        line-height: 1;
        animation: point-right 1.4s ease-in-out infinite;
      }

      @keyframes point-right {
        0%,
        100% {
          transform: translateX(0);
        }

        50% {
          transform: translateX(7px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .document-switcher__arrow {
          animation: none;
        }

        .document-switcher__button {
          transition: none;
        }
      }

      @media (max-width: 900px) {
        :root {
          --switcher-width: 0px;
        }

        .document-viewer {
          width: 100%;
        }

        .document-switcher {
          top: auto;
          right: 18px;
          bottom: 18px;
          width: auto;
          height: auto;
        }

        .document-switcher__button {
          min-width: 0;
          padding: 14px 17px;
          font-size: 15px;
        }
      }
    </style>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FT1KCDMZJQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-FT1KCDMZJQ');
    </script>

    <script src="./pdf-viewer.js"></script>
  </head>

  <body>
    <main id="document-viewer" class="document-viewer"></main>

    <aside class="document-switcher" aria-label="Document navigation">
      <button
        id="document-switcher-button"
        class="document-switcher__button"
        type="button"
        aria-label="Show cover letter"
      >
        <span id="document-switcher-label">Cover Letter</span>
        <span class="document-switcher__arrow" aria-hidden="true">→</span>
      </button>
    </aside>

    <script>
      const documents = {
        cv: {
          fileName: 'Aleksander Figiel - CV.pdf',
          title: 'Aleksander Figiel - CV',
          nextLabel: 'Cover Letter',
          nextAriaLabel: 'Show cover letter'
        },
        coverLetter: {
          fileName: 'Aleksander Figiel - Cover Letter.pdf',
          title: 'Aleksander Figiel - Cover Letter',
          nextLabel: 'CV',
          nextAriaLabel: 'Show CV'
        }
      };

      const embedPdf = getEmbedPdf('d4519458d2854a5aa28d923b316c2afe');
      const viewer = document.getElementById('document-viewer');
      const button = document.getElementById('document-switcher-button');
      const label = document.getElementById('document-switcher-label');

      let currentDocument = 'cv';

      embedPdf(documents[currentDocument].fileName, '#document-viewer');

      button.addEventListener('click', function () {
        currentDocument = currentDocument === 'cv' ? 'coverLetter' : 'cv';

        const documentConfig = documents[currentDocument];
        const embed = viewer.querySelector('embed');

        embed.src = documentConfig.fileName;
        document.title = documentConfig.title;
        label.textContent = documentConfig.nextLabel;
        button.setAttribute('aria-label', documentConfig.nextAriaLabel);
      });
    </script>
  </body>
</html>
