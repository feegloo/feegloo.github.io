<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aleksander Figiel - CV</title>
    <meta name="description" content="Aleksander Figiel, JavaScript Software Engineer" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #292929;
      }

      .document-viewer,
      .document-viewer embed {
        display: block;
        width: 100%;
        height: 100%;
      }

      .document-switcher {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        pointer-events: none;
      }

      .document-switcher__button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 11px 14px;
        border: 0;
        border-radius: 9px;
        background: rgba(20, 20, 20, 0.92);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34);
        color: #fff;
        font: 700 14px/1.2 Arial, sans-serif;
        cursor: pointer;
        pointer-events: auto;
      }

      .document-switcher__button:hover {
        background: #111;
      }

      .document-switcher__button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .document-switcher__arrow {
        font-size: 23px;
        line-height: 1;
      }
    </style>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FT1KCDMZJQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-FT1KCDMZJQ');
    </script>

    <script src="./pdf-viewer.js"></script>
  </head>

  <body>
    <main id="document-viewer" class="document-viewer"></main>

    <aside class="document-switcher" aria-label="Document navigation">
      <button
        id="document-switcher-button"
        class="document-switcher__button"
        type="button"
        aria-label="Show cover letter"
      >
        <span id="document-switcher-label">Cover Letter</span>
        <span class="document-switcher__arrow" aria-hidden="true">→</span>
      </button>
    </aside>

    <script>
      const documents = {
        cv: {
          fileName: 'Aleksander Figiel - CV.pdf',
          title: 'Aleksander Figiel - CV',
          nextLabel: 'Cover Letter',
          nextAriaLabel: 'Show cover letter'
        },
        coverLetter: {
          fileName: 'Aleksander Figiel - Cover Letter.pdf',
          title: 'Aleksander Figiel - Cover Letter',
          nextLabel: 'CV',
          nextAriaLabel: 'Show CV'
        }
      };

      const embedPdf = getEmbedPdf('d4519458d2854a5aa28d923b316c2afe');
      const viewer = document.getElementById('document-viewer');
      const button = document.getElementById('document-switcher-button');
      const label = document.getElementById('document-switcher-label');

      let currentDocument = 'cv';

      embedPdf(documents[currentDocument].fileName, '#document-viewer');

      button.addEventListener('click', function () {
        currentDocument = currentDocument === 'cv' ? 'coverLetter' : 'cv';

        const documentConfig = documents[currentDocument];
        const embed = viewer.querySelector('embed');

        embed.src = documentConfig.fileName;
        document.title = documentConfig.title;
        label.textContent = documentConfig.nextLabel;
        button.setAttribute('aria-label', documentConfig.nextAriaLabel);
      });
    </script>
  </body>
</html>
